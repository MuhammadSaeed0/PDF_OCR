; =====================================================================
;  PDF OCR - configuration
;  Edit this file with Notepad and save it as UTF-8.
;  Restart the application after changing it (the GUI saves it for you).
;  Paths may be absolute (D:\...) or relative to this file's folder.
;  Do not put quotes around paths. Comments start with ; at the start of a line.
; =====================================================================

[folders]
; Folder containing the scanned (image-only) PDFs. The files here are never modified.
source_folder = D:\Projects\PDF_OCR\Input

; Folder where the searchable PDFs are saved, with exactly the same file names.
; Created automatically if it does not exist. Must be different from source_folder.
destination_folder = D:\Projects\PDF_OCR\Output

; true = also process PDFs in subfolders of source_folder (the subfolder
; structure is recreated in destination_folder). false = top folder only.
include_subfolders = false

[ocr]
; Which language(s) Tesseract reads.
;   auto     - detect per book (recommended): Arabic books are read with Arabic only
;              (no garbled Latin letters), English books with English + Arabic.
;   ara      - Arabic only          eng+ara - English first, plus Arabic
;   ara+eng  - Arabic first, plus English (English terms are kept, but some hard
;              Arabic words may come out as Latin letters)
; Every language needs its <code>.traineddata file (see README).
languages = auto

; Resolution used to READ the pages (the pages in the output keep their original images).
; Every page is enlarged to A4 at this resolution before OCR, whatever size the PDF declares.
; 300 is best for book print; 400 can help very small print (slower).
resolution = 300

; Tesseract page layout analysis: 3 = automatic (recommended), 4 = single column,
; 6 = one uniform block of text, 11 = sparse text (scattered labels).
page_segmentation_mode = 3

; true = pages that already contain text (digital pages) are left as they are.
skip_pages_with_text = true

; true = crooked scans are straightened (recommended). Only a rotation is applied to the
; page; the scanned image itself is not re-encoded and the file does not grow. This is
; needed for correct right-to-left reading order of the text on crooked pages.
; false = pages keep their crooked look and are read without straightening.
straighten_pages = true

; Pages OCR'd at the same time. 0 = one per CPU thread.
jobs = 0

; Maximum seconds Tesseract may spend on one page (that page is then left without text).
tesseract_timeout = 300

; Stop OCR of a single PDF after this many minutes (it is retried later). 0 = no limit.
file_timeout_minutes = 360

[monitor]
; Seconds between scans of the source folder.
scan_interval_seconds = 15

; A new or changed file must keep the same size and modification time for this many
; seconds before it is processed (protects against files that are still being copied).
stable_seconds = 10

; After a temporary failure, wait this long before retrying. The wait doubles after
; each failed attempt, up to max_retry_delay_seconds.
retry_delay_seconds = 120
max_retry_delay_seconds = 3600

; Keep at least this much free disk space (MB) on the destination and temp drives.
min_free_space_mb = 1024

[paths]
; Leave empty to detect automatically (PATH, C:\Program Files\Tesseract-OCR).
; Example: tesseract_dir = C:\Program Files\Tesseract-OCR
tesseract_dir =
; Folder with the *.traineddata language files. Empty = the project's .\tessdata folder if
; tools\setup_tessdata.py created it, otherwise Tesseract's own tessdata folder.
tessdata_dir =
; Where the processing state (which files are done) is stored.
state_dir = data

[logging]
log_dir = logs
; DEBUG, INFO, WARNING or ERROR
log_level = INFO
; The log file is rotated when it reaches this size; this many old files are kept.
max_log_size_mb = 10
backup_count = 5
