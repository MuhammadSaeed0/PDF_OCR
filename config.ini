; =====================================================================
;  PDF OCR - configuration
;  Edit this file with Notepad and save it as UTF-8.
;  Restart the application after changing it (the GUI saves it for you).
;  Paths may be absolute (D:\...) or relative to this file's folder.
;  Do not put quotes around paths. Comments start with ; at the start of a line.
; =====================================================================

[folders]
; Folder containing the scanned (image-only) PDFs. The files here are never modified.
source_folder = D:\Projects\PDF_OCR\Input

; Folder where the searchable PDFs are saved, with exactly the same file names.
; Created automatically if it does not exist. Must be different from source_folder.
destination_folder = D:\Projects\PDF_OCR\Output

; true = also process PDFs in subfolders of source_folder (the subfolder
; structure is recreated in destination_folder). false = top folder only.
include_subfolders = false

[ocr]
; Tesseract language codes joined with +. The first one is the main language.
; eng = English, ara = Arabic, fra = French, deu = German, ...
; Every language needs its <code>.traineddata file (see README).
languages = eng+ara

; What to do with pages that already contain text:
;   skip_text  - OCR only pages without text; pages with text are copied unchanged (recommended)
;   redo_ocr   - replace an existing invisible OCR layer with a new one
;   force_ocr  - rasterise and OCR every page (changes the look of digital pages; not recommended)
mode = skip_text

; Automatically rotate pages scanned upside down / sideways (needs osd.traineddata).
rotate_pages = false

; Straighten crooked scans. Changes the page image slightly. Not allowed with mode = redo_ocr.
deskew = false

; Output size optimisation: 0 = none, 1 = safe lossless (recommended).
; 2 and 3 are lossy and require the extra programs pngquant and jbig2enc.
optimize = 1

; pdf = keep the original images untouched (recommended).
; pdfa / pdfa-2 = archival PDF/A (converted by Ghostscript; images may be re-encoded).
output_type = pdf

; How the text layer is written: sandwich, hocr or auto.
; sandwich (Tesseract's own renderer) is recommended for Arabic: it keeps the spaces between
; Arabic words, which the hocr renderer sometimes loses (words glued together in search/copy).
pdf_renderer = sandwich

; CPU cores used for one PDF. 0 = all cores.
jobs = 0

; Maximum seconds Tesseract may spend on one page (a page that takes longer gets no text).
tesseract_timeout = 300

; Upscale low-resolution scans to this DPI before OCR (e.g. 300). 0 = off.
oversample = 0

; Stop OCR of a single PDF after this many minutes (it is retried later). 0 = no limit.
file_timeout_minutes = 120

; Extra OCRmyPDF command-line options for advanced users, e.g.  --tesseract-pagesegmode 6
extra_args =

[monitor]
; Seconds between scans of the source folder.
scan_interval_seconds = 15

; A new or changed file must keep the same size and modification time for this many
; seconds before it is processed (protects against files that are still being copied).
stable_seconds = 10

; After a temporary failure, wait this long before retrying. The wait doubles after
; each failed attempt, up to max_retry_delay_seconds.
retry_delay_seconds = 120
max_retry_delay_seconds = 3600

; Keep at least this much free disk space (MB) on the destination and temp drives.
min_free_space_mb = 1024

[paths]
; Leave empty to detect automatically (PATH, C:\Program Files\Tesseract-OCR, C:\Program Files\gs\...).
; Example: tesseract_dir = C:\Program Files\Tesseract-OCR
tesseract_dir =
; Example: ghostscript_dir = C:\Program Files\gs\gs10.05.1\bin
ghostscript_dir =
; Folder with the *.traineddata language files. Empty = the project's .\tessdata folder if
; tools\setup_tessdata.py created it, otherwise Tesseract's own tessdata folder.
tessdata_dir =
; Where the processing state (which files are done) is stored.
state_dir = data

[logging]
log_dir = logs
; DEBUG, INFO, WARNING or ERROR
log_level = INFO
; The log file is rotated when it reaches this size; this many old files are kept.
max_log_size_mb = 10
backup_count = 5
